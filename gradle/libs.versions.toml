[versions]
detekt = "2.0.0-alpha.6"
spring-boot-v4 = "4.0.9"

[libraries]
detekt = { group = "dev.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
detekt-formatting = { group = "dev.detekt", name = "detekt-rules-ktlint-wrapper", version.ref = "detekt" }
detekt-libraries = { group = "dev.detekt", name = "detekt-rules-libraries", version.ref = "detekt" }
spring-boot-v4-dependencies = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "spring-boot-v4" }
springdoc-openapi-bom = "org.springdoc:springdoc-openapi-bom:3.2.0"
commons-lang3 = "org.apache.commons:commons-lang3:3.21.0"
liquibase-core = "org.liquibase:liquibase-core:5.0.4"
liquibase-sessionlock = "com.github.blagerweij:liquibase-sessionlock:1.6.9"
netty-all = "io.netty:netty-all:4.2.19.Final"
kotlin-logging = "io.github.oshai:kotlin-logging-jvm:8.0.4"

[plugins]
spring-boot-v4 = { id = "org.springframework.boot", version.ref = "spring-boot-v4" }
osdetector = { id = "com.google.osdetector", version = "1.7.3" }
